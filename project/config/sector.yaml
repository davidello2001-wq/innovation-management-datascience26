# Sector definition: Smart glasses (client: Amplifon)
#
# Codes are written WITHOUT blanks and matched by prefix after removing the
# blanks from the PATSTAT symbol (as in Tutorial 0, symbol_prefix_condition):
# "G02B27/017" also selects G02B27/0172, G02B27/0176, ...
#
# Titles in the comments are from memory: VERIFY each one in the CPC scheme
# (https://www.cooperativepatentclassification.org) before the final run.
# Status: v0.1, first classification of the codes in key_words.ipynb.

sector_name: "Smart glasses"

description: >
  Smart glasses are wearable computing devices in the form of eyeglasses or
  other head-worn eyewear that integrate electronic components into the frame
  or lenses, such as see-through or near-eye displays, cameras and sensors,
  microphones and speakers (including bone-conduction transducers),
  processors, batteries and wireless connectivity. They capture information
  about the wearer and the surroundings and deliver visual and/or audio
  information to the wearer, enabling functions such as augmented-reality
  overlays, hands-free communication and media, navigation, health monitoring
  and hearing assistance.

years:
  min: 2000          # earliest priority year (earliest_filing_year)
  max: 2025
  truncated: 3       # last incomplete priority years, flagged not dropped

ipr_type: "PI"       # patents of invention only

# ---------------------------------------------------------------- selection
selection:

  # Enough on their own: a family with one of these codes is in the sector
  core_cpc:
    - "G02B27/017"       # head-mounted displays (covers /0172 optical, /0176 mechanical features)
    - "G02B2027/0178"    # head-mounted displays, eyeglass type
    - "G02B2027/0174"    # head-mounted displays, holographic optical features
    - "G02C11/10"        # spectacles: electronic devices other than hearing aids
    - "G02C11/06"        # spectacles: hearing aids
    - "G02C11/00"        # spectacles: non-optical adjuncts (main group only, may include passive adjuncts)

  core_ipc:
    - "G02B27/017"       # head-mounted (check it exists in IPC; otherwise G02B27/01 + eyewear terms)
    - "G02C11/10"
    - "G02C11/06"
    - "G02C11/00"

  # Never enough alone: kept only with an eyewear term, or after the semantic filter
  component_cpc:
    # display & optics: head-up displays in general (also cars, helmets)
    - "G02B27/0179"      # HUD display position adjusting means
    - "G02B27/0081"      # optical systems altering entrance/exit pupil
    - "G02B6/34"         # light guides: coupling by prism or grating (waveguides)
    - "G02B5/18"         # diffraction gratings
    - "G02B5/32"         # holograms as optical elements
    - "G02B2027/0116"    # HUD: chromatic aberration correction
    - "G02B2027/0118"    # HUD: contrast / brilliance
    - "G02B2027/0123"    # HUD: increasing the field of view
    - "G02B2027/013"     # HUD: combiner of particular shape
    - "G02B2027/0132"    # HUD: binocular systems
    - "G02B2027/0134"    # HUD: binocular stereoscopic
    - "G02B2027/0185"    # HUD: image at variable distance
    - "G02B2027/015"     # HUD: mechanical features
    - "G02B2027/0152"    # HUD: lighter or better balanced devices
    - "G02B2027/014"     # HUD: information / image processing
    # camera & sensing
    - "G02B27/0093"      # optical systems monitoring the user (head / eye tracking)
    - "G02B2027/0138"    # HUD: image capture systems, e.g. camera
    - "G06F3/013"        # eye-tracking input
    - "H04N23/57"        # cameras embedded in other devices
    - "G06T7/70"         # position / orientation estimation (very broad)
    - "G06T7/80"         # camera calibration (very broad)
    # interaction & software
    - "G02B2027/0187"    # display position slaved to head / eye motion
    - "G06F3/011"        # interaction with the human body, e.g. immersion
    - "G06F3/012"        # head-tracking input
    - "G06F3/017"        # gesture-based interaction
    - "G06T19/006"       # mixed reality
    - "G06V20/20"        # augmented-reality scenes
    - "G06F1/163"        # wearable computers
    - "H04W12/33"        # security using wearable devices
    # audio & hearing
    - "H04R1/10"         # earpieces, earphones
    - "H04R1/028"        # loudspeaker casings in devices with other functions
    # frame, power & connectivity
    - "G02C5/00"         # spectacle frames: non-optical parts (main group only)
    - "G02C5/14"         # side-members (temples)
    - "G02C5/22"         # hinges
    - "H01Q1/273"        # antennas worn on the body
    # NEW, not in key_words.ipynb yet (verify in the scheme)
    - "H04R25/"          # hearing aids (all subgroups)
    - "H04R2460/13"      # hearing devices using bone conduction

  component_ipc:
    - "G02B27/01"        # head-up displays
    - "G06F3/01"         # input arrangements for interaction with the user
    - "G06F1/16"         # constructional details of portable computers
    - "H04R1/10"
    - "H04R25/"

  # Enough on their own (searched case-insensitively in titles and abstracts)
  specific_keywords:
    - "smart glasses"
    - "smart eyewear"
    - "smart spectacles"
    - "intelligent glasses"
    - "augmented reality glasses"    # not "ar glasses": it would also match "solar glasses", "polar glasses"
    - "mixed reality glasses"
    - "eyeglass-type display"
    - "glasses-type display"
    - "spectacle-type display"
    - "head-mounted display glasses"
    - "hearing glasses"
    - "audio glasses"

  # Used with component codes: the family must mention eyewear
  eyewear_terms:
    - "eyeglass"
    - "eyewear"
    - "spectacle"
    - "glasses"          # watch out: also the material ("optical glasses"); check in the diagnostics
    - "eye glasses"
    - "nose pad"
    - "temple arm"

  # Removes known false positives (applied to the whole candidate pool)
  exclude_terms:
    - "windshield"
    - "windscreen"

# ---------------------------------------------------------------- segments
# Not used to select patents: each selected family is tagged with one or more
# segments for Step 1 (technology mix) and Step 2 (subfield growth).
segments:
  display_optics:
    cpc: ["G02B27/01", "G02B2027/01", "G02B6/34", "G02B5/18", "G02B5/32", "G02B27/0081"]
    terms: ["waveguide", "projector", "microdisplay", "see-through display", "combiner"]
  audio_hearing:
    cpc: ["H04R", "G02C11/06", "H04R2460/13"]
    terms: ["bone conduction", "speaker", "microphone", "beamforming", "hearing aid", "hearing"]
  camera_sensing:
    cpc: ["G02B27/0093", "G02B2027/0138", "G06F3/013", "H04N23/57", "G06T7/70", "G06T7/80", "A61B5/"]
    terms: ["camera", "eye tracking", "sensor", "heart rate", "biometric"]
  interaction_software:
    cpc: ["G06F3/011", "G06F3/012", "G06F3/017", "G06T19/006", "G06V20/20", "G02B2027/0187", "H04W12/33"]
    terms: ["gesture", "voice command", "gaze", "virtual object", "augmented reality"]
  frame_power:
    cpc: ["G02C5/", "H01Q1/273", "H02J"]
    terms: ["hinge", "battery", "charging", "antenna", "temple"]
