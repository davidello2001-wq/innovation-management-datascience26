# Sector definition: Smart glasses (client: Amplifon)
#
# Codes are written WITHOUT blanks and matched by prefix after removing the
# blanks from the PATSTAT symbol (as in Tutorial 0, symbol_prefix_condition):
# "G02B27/017" also selects G02B27/0172, G02B27/0176, ...
#
# Titles in the comments are from memory: VERIFY each one in the CPC scheme
# (https://www.cooperativepatentclassification.org) before the final run.
# Status: v0.2, codes reclassified with 01_code_diagnostics on PROD.
# Numbers in the comments: families 2000-2025 (PROD) and share of them whose
# title/abstract mentions eyewear ("eye"), from code_diagnostics_PROD.csv.

sector_name: "Smart glasses"

description: >
  Smart glasses are wearable computing devices in the form of eyeglasses or
  other head-worn eyewear that integrate electronic components into the frame
  or lenses, such as see-through or near-eye displays, cameras and sensors,
  microphones and speakers (including bone-conduction transducers),
  processors, batteries and wireless connectivity. They capture information
  about the wearer and the surroundings and deliver visual and/or audio
  information to the wearer, enabling functions such as augmented-reality
  overlays, hands-free communication and media, navigation, health monitoring
  and hearing assistance.

years:
  min: 2000          # earliest priority year (earliest_filing_year)
  max: 2025
  truncated: 3       # last incomplete priority years, flagged not dropped

ipr_type: "PI"       # patents of invention only

# ---------------------------------------------------------------- selection
selection:

  # Rule A · enough on their own: smart eyewear by definition
  core_cpc:
    - "G02B2027/0178"    # HMD, eyeglass type                         12,508 fam, eye 0.34 (abstracts say "HMD", not "glasses")
    - "G02C11/10"        # spectacles: electronic devices              3,514 fam, eye 0.68
    - "G02C11/06"        # spectacles: hearing aids                      423 fam, eye 0.67 (key for Amplifon)

  core_ipc:
    - "G02C11/06"        # hearing aids on spectacles                    484 fam, eye 0.73
    # G02B27/017 and G02C11/10 do not exist in IPC (0 families): electronic
    # spectacles are in IPC G02C11/00, handled by rule C below

  # Rule B · generic technologies: kept only if the family mentions eyewear_terms
  component_cpc:
    # display & optics
    - "G02B27/017"       # HMD, all types (incl. VR headsets, helmets)  32,220 fam, eye 0.17 -> moved out of core in v0.2
    - "G02B2027/0174"    # HMD, holographic                             1,934 fam, eye 0.09 -> moved out of core in v0.2
    - "G02B27/0179"      # HUD display position adjusting means         2,375 fam, eye 0.07
    - "G02B27/0081"      # altering entrance/exit pupil                 2,057 fam, eye 0.05
    - "G02B6/34"         # light guides: prism / grating coupling       2,020 fam, eye 0.01
    - "G02B5/18"         # diffraction gratings                         8,566 fam, eye 0.02
    - "G02B5/32"         # holograms as optical elements                2,519 fam, eye 0.02
    - "G02B2027/0116"    # HUD: chromatic aberration                      412 fam, eye 0.06
    - "G02B2027/0118"    # HUD: contrast / brilliance                   2,880 fam, eye 0.06
    - "G02B2027/0123"    # HUD: field of view                           2,253 fam, eye 0.08
    - "G02B2027/013"     # HUD: combiner                               10,044 fam, eye 0.12
    - "G02B2027/0132"    # HUD: binocular                                 914 fam, eye 0.14
    - "G02B2027/0134"    # HUD: binocular stereoscopic                  1,757 fam, eye 0.10
    - "G02B2027/0185"    # HUD: image at variable distance                763 fam, eye 0.04
    - "G02B2027/015"     # HUD: mechanical features                     3,030 fam, eye 0.09
    - "G02B2027/0152"    # HUD: lighter / balanced                        293 fam, eye 0.08
    - "G02B2027/014"     # HUD: image processing                       10,106 fam, eye 0.10
    # camera & sensing
    - "G02B27/0093"      # monitoring the user (head / eye tracking)    6,520 fam, eye 0.09
    - "G02B2027/0138"    # HUD: image capture, camera                   7,517 fam, eye 0.13
    - "G06F3/013"        # eye-tracking input                          17,356 fam, eye 0.06
    - "H04N23/57"        # cameras embedded in other devices           18,392 fam, eye 0.01
    - "G06T7/70"         # position / orientation estimation           31,052 fam, eye 0.004 (adds little)
    - "G06T7/80"         # camera calibration                          17,729 fam, eye 0.003 (adds little)
    # interaction & software
    - "G02B2027/0187"    # display slaved to head / eye motion          4,827 fam, eye 0.08
    - "G06F3/011"        # interaction with the human body             37,854 fam, eye 0.04
    - "G06F3/012"        # head-tracking input                          8,728 fam, eye 0.05
    - "G06F3/017"        # gesture-based interaction                   27,153 fam, eye 0.02
    - "G06T19/006"       # mixed reality                               26,584 fam, eye 0.04
    - "G06V20/20"        # augmented-reality scenes                     9,697 fam, eye 0.04
    - "G06F1/163"        # wearable computers                          23,771 fam, eye 0.02
    - "H04W12/33"        # security using wearable devices                940 fam, eye 0.01
    # audio & hearing (few eyewear families, but exactly the Amplifon segment)
    - "H04R1/10"         # earpieces, earphones                        24,383 fam, eye 0.011 (277 fam)
    - "H04R1/028"        # loudspeakers in devices with other functions 5,332 fam, eye 0.02
    - "H04R25/"          # hearing aids                                11,710 fam, eye 0.009 (103 fam)
    - "H04R2460/13"      # bone conduction hearing devices              2,304 fam, eye 0.05
    # connectivity
    - "H01Q1/273"        # antennas worn on the body                    3,132 fam, eye 0.03

  component_ipc:
    - "G02B27/01"        # head-up displays                            49,607 fam, eye 0.13
    - "G06F3/01"         # input arrangements                         118,648 fam, eye 0.03
    - "G06F1/16"         # portable computers                          85,039 fam, eye 0.006
    - "H04R1/10"         #                                             28,465 fam, eye 0.011
    - "H04R25/"          #                                             16,950 fam, eye 0.010

  # Rule C · eyewear by definition but mostly conventional glasses: kept only
  # if the family mentions smart_terms (an eyewear test would always pass)
  eyewear_cpc:
    - "G02C11/00"        # spectacles: non-optical adjuncts, main group 1,585 fam, eye 0.83
    - "G02C5/"           # spectacle frames, all subgroups (5/00: 2,379 fam, 5/14: 2,504, 5/22: 2,224; eye > 0.8)

  eyewear_ipc:
    - "G02C11/00"        # in IPC this also holds electronic spectacles 6,241 fam, eye 0.73
    - "G02C5/"

  # Review · head-mounted / head-up displays without an eyewear term: many are
  # smart glasses described as "head-mounted display". Not in the sector yet:
  # they go to the semantic filter (step 3).
  review_cpc:
    - "G02B27/01"        # head-up displays, all subgroups (incl. 27/017 HMD)
    - "G02B2027/01"      # head-up display indexing codes
  review_ipc:
    - "G02B27/01"

  # Enough on their own (searched case-insensitively in titles and abstracts)
  specific_keywords:
    - "smart glasses"
    - "smart eyewear"
    - "smart spectacles"
    - "intelligent glasses"
    - "augmented reality glasses"    # not "ar glasses": it would also match "solar glasses", "polar glasses"
    - "mixed reality glasses"
    - "eyeglass-type display"
    - "glasses-type display"
    - "spectacle-type display"
    - "head-mounted display glasses"
    - "hearing glasses"
    - "audio glasses"

  # Used with eyewear codes (rule C): the family must mention an electronic function
  smart_terms:
    - "electronic"
    - "circuit"
    - "battery"
    - "display"
    - "camera"
    - "sensor"
    - "speaker"
    - "microphone"
    - "earphone"
    - "bone conduction"
    - "hearing aid"
    - "wireless"
    - "bluetooth"
    - "processor"
    - "projector"

  # Used with component codes (rule B): the family must mention eyewear
  eyewear_terms:
    - "eyeglass"
    - "eyewear"
    - "spectacle"
    - "glasses"          # watch out: also the material ("optical glasses"); check in the diagnostics
    - "eye glasses"
    - "nose pad"
    - "temple arm"

  # Removes known false positives (applied to the whole candidate pool)
  exclude_terms:
    - "windshield"
    - "windscreen"

# ---------------------------------------------------------------- segments
# Not used to select patents: each selected family is tagged with one or more
# segments for Step 1 (technology mix) and Step 2 (subfield growth).
segments:
  display_optics:
    cpc: ["G02B27/01", "G02B2027/01", "G02B6/34", "G02B5/18", "G02B5/32", "G02B27/0081"]
    terms: ["waveguide", "projector", "microdisplay", "see-through display", "combiner"]
  audio_hearing:
    cpc: ["H04R", "G02C11/06", "H04R2460/13"]
    terms: ["bone conduction", "speaker", "microphone", "beamforming", "hearing aid", "hearing"]
  camera_sensing:
    cpc: ["G02B27/0093", "G02B2027/0138", "G06F3/013", "H04N23/57", "G06T7/70", "G06T7/80", "A61B5/"]
    terms: ["camera", "eye tracking", "sensor", "heart rate", "biometric"]
  interaction_software:
    cpc: ["G06F3/011", "G06F3/012", "G06F3/017", "G06T19/006", "G06V20/20", "G02B2027/0187", "H04W12/33"]
    terms: ["gesture", "voice command", "gaze", "virtual object", "augmented reality"]
  frame_power:
    cpc: ["G02C5/", "H01Q1/273", "H02J"]
    terms: ["hinge", "battery", "charging", "antenna", "temple"]
